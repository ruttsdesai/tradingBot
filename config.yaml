# ===== Trading Bot Configuration =====

# API Keys (set via environment variables or .env file)
# Copy .env.example to .env and fill in your keys
api:
  binance_api_key: ${BINANCE_API_KEY}
  binance_secret: ${BINANCE_SECRET}
  alpaca_api_key: ${ALPACA_API_KEY}
  alpaca_api_secret: ${ALPACA_API_SECRET}
  dhan_client_id: ${DHAN_CLIENT_ID}
  dhan_access_token: ${DHAN_ACCESS_TOKEN}
  dhan_sandbox_client_id: ${DHAN_SANDBOX_CLIENT_ID}
  dhan_sandbox_access_token: ${DHAN_SANDBOX_ACCESS_TOKEN}
  telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
  tg_api_id: ${TG_API_ID}
  tg_api_hash: ${TG_API_HASH}

# Data Settings
data:
  stocks:
    lookback_years: 20          # 2006–2026: full 20-year backtest
    interval: "1d"              # daily candles
    default_tickers:
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - META
      - TSLA
      - NVDA
      - SPY                # S&P 500 benchmark
      - QQQ                # Nasdaq benchmark
      - JPM
  india:
    lookback_years: 20          # 2006–2026: NSE (India)
    interval: "1d"
    default_tickers:
      - RELIANCE.NS        # Reliance Industries (MACD: +35.9%)
      - TCS.NS             # Tata Consultancy Services (BB: +82.1%, Sharpe 0.90)
      - HDFCBANK.NS        # HDFC Bank (BB: +38.7%)
      - INFY.NS            # Infosys (MACD: +33.2%)
      - ICICIBANK.NS       # ICICI Bank (BB: +77.5%, MACD: +47.8%)
      - BHARTIARTL.NS      # Bharti Airtel (BB: +53.1%, MACD: +52.3%)
      - ITC.NS             # ITC Ltd (BB: +33.4%)
      - HINDUNILVR.NS      # Hindustan Unilever (MACD: +39.7%)
      - SBIN.NS            # State Bank of India (MACD: +40.7%)
      - LT.NS              # Larsen & Toubro (BB: +60.4%, MACD: +56.1%)
      - KOTAKBANK.NS       # Kotak Mahindra Bank
      - AXISBANK.NS        # Axis Bank
      - BAJFINANCE.NS      # Bajaj Finance (NBFC)
      - MARUTI.NS          # Maruti Suzuki (Auto)
      - SUNPHARMA.NS       # Sun Pharma
      - ASIANPAINT.NS      # Asian Paints (Consumer)
      - NESTLEIND.NS       # Nestle India (FMCG)
      - WIPRO.NS           # Wipro (IT)
      - TITAN.NS           # Titan (Consumer)
      - M&M.NS             # Mahindra & Mahindra (Auto)
      - HCLTECH.NS         # HCL Technologies (IT)
  canada:
    lookback_years: 20          # 2006–2026: TSX (Canada)
    interval: "1d"
    default_tickers:
      - RY.TO              # Royal Bank of Canada
      - TD.TO              # TD Bank
      - SHOP.TO            # Shopify
      - ENB.TO             # Enbridge
      - BNS.TO             # Bank of Nova Scotia
      - CNR.TO             # Canadian National Railway
      - CP.TO              # Canadian Pacific Railway
      - BMO.TO             # Bank of Montreal
      - TRP.TO             # TC Energy
      - CSU.TO             # Constellation Software
  crypto:
    lookback_years: 4           # ~2022–2026: covers bear + bull
    interval: "1d"              # daily candles
    default_tickers:
      - BTC/USDT
      - ETH/USDT
      - SOL/USDT
      - BNB/USDT
      - XRP/USDT
      - ADA/USDT

# Paper Trading Settings
paper_trading:
  initial_capital: 100000.0     # $100k fake money
  max_positions: 5              # max concurrent open positions
  max_allocation_pct: 0.20      # max 20% of portfolio per position

# Position Sizing (ATR-based, overrides fixed allocation when enabled)
position_sizing:
  use_atr_sizing: false          # true = size by volatility, false = fixed %
  position_risk_pct: 0.01        # risk 1% of portfolio per trade
  atr_period: 14                 # ATR lookback period
  atr_multiplier: 2.0            # stop distance = ATR * multiplier

# Live Trading (Alpaca Markets)
live_trading:
  paper: true                    # true = Alpaca paper trading, false = real money
  initial_capital: 100000.0      # starting capital (for tracking only)
  max_positions: 5
  max_allocation_pct: 0.20
  poll_interval_seconds: 60      # seconds between evaluation cycles
  tickers:                       # default tickers to trade live
    - AAPL
    - MSFT
    - GOOGL

# Live Trading (Dhan — India NSE)
dhan_live_trading:
  sandbox: false                 # true = sandbox (no IP whitelist needed!), false = REAL MONEY (requires IP whitelist)
  disable_ssl: false             # true if sandbox SSL issues
  initial_capital: 1027          # Rs 1,027 actual balance (down from 3,000 after churning losses)
  max_positions: 2               # max 2 concurrent positions (small capital — Rs ~500 each at 35%)
  max_allocation_pct: 0.35       # max 35% per position (~Rs 360) — prevents single-position wipeout
  poll_interval_seconds: 60      # seconds between evaluation cycles
  intraday: true                 # true = use intraday bars (5m/15m) for continuous all-day trading
  intraday_interval: "5m"        # candle interval for intraday: 1m, 5m, 15m, 30m, 1h
  max_hold_minutes: 120           # force-exit positions held longer than this with minimal profit
  min_profit_threshold_pct: 0.005 # min 0.5% profit to keep a stale position (below = time-exit)
  min_volatility_pct: 0.0015      # skip BUYs if ATR/close < 0.15% (sideways / dead market)
  stop_buying_minutes: 900        # 15:00 IST — stop opening new positions (30 min before close)
  force_square_off_minutes: 910   # 15:10 IST — auto-square-off all MIS positions
  tickers:                       # India NSE tickers (21 stocks, diversified across 8 sectors)
    - ICICIBANK.NS               # Banking — BB: +99.8%, MACD: +47.8%
    - SBIN.NS                    # Banking — MACD: +40.7%
    - BHARTIARTL.NS              # Telecom — BB: +53.1%, MACD: +52.3%
    - LT.NS                      # Infra — BB: +60.4%, MACD: +56.1%
    - HINDUNILVR.NS              # FMCG — MACD: +39.7%
    - RELIANCE.NS                # Conglomerate — MACD: +35.9%
    - INFY.NS                    # IT — MACD: +33.2%
    - TCS.NS                     # IT — BB: +82.1%, Sharpe 0.90
    - HDFCBANK.NS                # Banking — BB: +38.7%, MA Cross: +29.5%
    - ITC.NS                     # FMCG — BB: +33.4%
    - KOTAKBANK.NS               # Banking — diversify from SBIN/ICICI/HDFC
    - AXISBANK.NS                # Banking — diversify from SBIN/ICICI/HDFC
    - BAJFINANCE.NS              # NBFC — Momentum: +64.4%
    - MARUTI.NS                  # Auto — different sector
    - SUNPHARMA.NS               # Pharma — defensive sector
    - ASIANPAINT.NS              # Consumer — different from FMCG
    - NESTLEIND.NS               # FMCG — defensive
    - WIPRO.NS                   # IT — diversify from INFY/TCS
    - TITAN.NS                   # Consumer — MACD: +59.2%, MA Cross: +57.4%
    - M&M.NS                     # Auto — different from Maruti
    - HCLTECH.NS                 # IT — diversify from INFY/TCS/WIPRO
  scheduler_strategies:           # strategies the scheduler runs daily (all 5)
    - macd                       # best all-rounder: +37.6% avg, 0.49 avg Sharpe
    - bollinger_bands            # highest ceiling: +40.8% avg, TCS +78.8%
    - ma_crossover               # reliable trend follower: +11.5% avg
    - rsi_mean_revert            # mean reversion: +17.8% avg
    - momentum_breakout          # breakout momentum: +5.6% avg, adds diversification

# Live Trading (Interactive Brokers) — one account, three markets
ibkr_live_trading:
  host: "127.0.0.1"              # TWS/Gateway host
  paper_port: 7497               # TWS paper: 7497, Gateway paper: 4002
  live_port: 7496                # TWS live: 7496, Gateway live: 4001
  client_id: 1                   # unique client ID per connection
  paper: true                    # true = paper account, false = real money
  initial_capital: 100000.0
  max_positions: 5
  max_allocation_pct: 0.20
  poll_interval_seconds: 60
  tickers:                       # default tickers per market
    usa:                         # US stocks (SMART routing)
      - NVDA
      - MSFT
      - QQQ
      - JPM
      - SPY
    india:                       # India NSE (walk-forward optimized)
      - SBIN.NS                  # State Bank of India + MACD = +39.57% OOS
      - ICICIBANK.NS             # ICICI Bank + Bollinger Bands = +28.05% OOS
      - BHARTIARTL.NS            # Bharti Airtel + MACD = +27.18% OOS
    canada:                      # Canada TSX
      - RY.TO                    # Royal Bank
      - TD.TO                    # TD Bank
      - SHOP.TO                  # Shopify

# Risk Management
risk:
  max_daily_loss_pct: 0.03      # stop trading if daily loss > 3%
  stop_loss_pct: 0.05           # hard stop-loss at 5% per position
  take_profit_pct: 0.15         # take profit at 15% per position
  max_position_size_pct: 0.20   # max 20% of capital per trade
  # Trailing stop (locks in gains — overrides fixed stop when in profit)
  trailing_stop_enabled: true   # lock in gains by trailing 8% below peak price
  trailing_stop_pct: 0.08       # trail at 8% below highest price since entry
  trailing_stop_atr_mult: 2.0   # alternative: trail at ATR * mult below peak (0 = use pct)
  # Correlation-based cluster limits (prevent over-concentration)
  correlation_enabled: false    # true = limit exposure to highly-correlated positions
  correlation_threshold: 0.70   # Pearson r above which tickers are clustered
  max_cluster_allocation_pct: 0.40  # max total % allocated to any correlated cluster

# Backtesting Settings
backtest:
  stocks:
    years: 20
    initial_capital: 100000.0
    commission_pct: 0.001       # 0.1% commission per trade
  crypto:
    years: 4
    initial_capital: 100000.0
    commission_pct: 0.001       # 0.1% (typical Binance fee)

# Strategy Parameters
strategies:
  ma_crossover:
    enabled: true
    fast_period: 20             # 20-day fast MA
    slow_period: 50             # 50-day slow MA
  rsi_mean_revert:
    enabled: true
    rsi_period: 14              # 14-day RSI
    oversold_threshold: 30      # buy when RSI < 30
    overbought_threshold: 70    # sell when RSI > 70
  macd:
    enabled: true
    fast_period: 12             # fast EMA period
    slow_period: 26             # slow EMA period
    signal_period: 12           # signal line EMA period (optimized via walk-forward: 12 best for India, 9 unchanged for US)
  bollinger_bands:
    enabled: true
    period: 10                  # SMA period for middle band (optimized via walk-forward on India NSE)
    num_std: 1.5                # std deviations for bands (optimized via walk-forward on India NSE)
  momentum_breakout:
    enabled: true
    lookback: 20                # breakout lookback window
    exit_sma: 10                # SMA period for exit signal

# Scheduler
scheduler:
  run_time: "09:15"             # Run daily at 9:15 AM IST (NSE market open)
  timezone: "Asia/Kolkata"      # Indian Standard Time (NSE market hours: 9:15 AM - 3:30 PM)
  mode: "dhan"                  # paper | live | crypto | dhan | both (crypto 24/7 + dhan daily)

# Crypto Live Trading (Binance)
crypto_live_trading:
  testnet: true                       # true = Binance testnet, false = real money
  initial_capital: 10000.0            # starting capital (for tracking only)
  max_positions: 5
  max_allocation_pct: 0.20
  poll_interval_seconds: 60           # seconds between evaluation cycles
  interval: "5m"                      # candle interval: 1d, 4h, 1h, 15m, 5m, 1m
  tickers:                            # Binance trading pairs
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT

# Parallel Day Trading — all 5 strategies run in parallel on ONE chart and
# merge into a single BUY/SELL decision via adaptive performance-weighted voting.
# Run with: python cli.py day-trade --ticker AAPL --interval 5m
day_trading:
  interval: "5m"                # intraday candle interval: 1m, 2m, 5m, 15m, 30m, 1h
  days: 60                      # days of intraday history (Yahoo caps 5m at 60)
  initial_capital: 100000.0
  commission_pct: 0.0005        # 0.05% per side (commission + slippage estimate)
  entry_threshold: 0.2          # consensus score to BUY (0.2 = weighted 60/40 bullish)
  exit_threshold: -0.2          # consensus score to SELL (weighted majority bearish)
  perf_window: 10               # recent virtual trades used to weight each strategy
  perf_sensitivity: 100.0       # weight = 1 + sensitivity * avg virtual return
  min_weight: 0.25              # losing strategies are muted, never silenced
  max_weight: 3.0               # winning strategies get up to 3x voice
  min_trades_for_weight: 3      # virtual trades before weight deviates from 1.0
  square_off: true              # force-exit at session close (no overnight risk)
  no_entry_last_bars: 6         # no new entries in last N bars (30 min on 5m)
  min_volatility_pct: 0.0       # skip entries if ATR/price below this (0 = off)
  trend_filter_period: 200      # only enter longs above this EMA (0 = off);
                                # keeps the bot out of persistent downtrends
  risk:                         # intraday-tight risk limits (vs 5%/15% daily)
    max_positions: 1            # one symbol, one chart
    max_allocation_pct: 0.95    # deploy nearly all capital into the single position
    max_daily_loss_pct: 0.02    # stop trading for the day after -2%
    stop_loss_pct: 0.01         # 1% hard stop per position
    take_profit_pct: 0.025      # 2.5% take profit
    trailing_stop_enabled: true
    trailing_stop_pct: 0.008    # trail 0.8% below intraday peak

# Ensemble Strategy (votes across multiple strategies for higher conviction)
ensemble:
  min_buy_votes: 2              # how many strategies must agree to BUY (out of 5)
  strategies:                   # which strategies to include
    - ma_crossover
    - rsi_mean_revert
    - macd
    - bollinger_bands
    - momentum_breakout

# Charting / Visualization
charts:
  output_dir: "charts"          # directory for saved chart PNGs
  dpi: 150                      # image resolution
  show_ma: true                 # overlay SMA 50 + SMA 200 on price chart

# Portfolio Rebalancing
rebalancing:
  enabled: false                      # true = rebalance after each paper/live run
  drift_threshold_pct: 0.05           # trigger when any position drifts > 5% from target
  min_trade_value: 100.0              # skip orders smaller than $100
  check_interval_days: 7              # how often to check (daily runs can override)
  target_weights:                     # target portfolio allocations (must sum to ~1.0)
    SPY: 0.30
    QQQ: 0.20
    AAPL: 0.15
    MSFT: 0.15
    GOOGL: 0.10
    NVDA: 0.10
